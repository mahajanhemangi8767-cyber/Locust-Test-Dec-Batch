name: Performance Testing with Locust 

on: 
   push:
      branches: ["main"]
      workflow_dispatch:

jobs:
  Performance-test:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout code     
         uses: actions/checkout@v6

       - name: Setup Python
         uses: actions/setup-python@v6
         with:
           python-version: '3.13'
       - name:
         run: python my_script.python    

       - name: Install Dependencies
         run: | 
           python -m pip install --upgrade pip 
           pip install -r requirements 

       - name: Start Application
         run: |
           python app.py &
           sleep 5

       - name: Run Locust Performance Test
         run: |
          locust -f locustfile.py --host https://127.0.0.0:5000 --users 50 --spawn-rate 5 --run-time 1m --headless --exit-code-on-error 1
          
         